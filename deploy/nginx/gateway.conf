# 生产入口：HTTPS/WSS 终结 + 反代 + 基础限流
# 证书放置 deploy/certs/fullchain.pem / privkey.pem（Let's Encrypt certbot 或云证书）

limit_req_zone $binary_remote_addr zone=api_zone:16m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login_zone:8m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=conn_zone:16m;

upstream api_upstream {
  least_conn;
  server api:8080 max_fails=3 fail_timeout=10s;
}
upstream game_upstream {
  # WS 有状态：ip_hash 保证同一客户端固定节点（多 game 节点时）
  ip_hash;
  server game:8090 max_fails=3 fail_timeout=10s;
}

server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  add_header Strict-Transport-Security "max-age=63072000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;

  client_max_body_size 1m;
  limit_conn conn_zone 40;

  # 登录/验证码低阈值限流
  location ~ ^/api/v1/auth/(guest|sms|password) {
    limit_req zone=login_zone burst=6 nodelay;
    proxy_pass http://api_upstream;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
  }

  location /api/ {
    limit_req zone=api_zone burst=40 nodelay;
    proxy_pass http://api_upstream;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
  }

  location /ws {
    proxy_pass http://game_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # 运营后台（建议再加 IP 白名单 / VPN）
  location /admin/ {
    proxy_pass http://admin-web/;
    proxy_set_header Host $host;
  }

  # 游戏客户端（H5/PC Web；静态资源可前置 CDN）
  location / {
    proxy_pass http://client-web/;
    proxy_set_header Host $host;
  }
}
