# 内测入口（HTTP，无域名 / 无证书）：docker-compose.test.yml 使用。
# 仅供内部测试与 APK 联调；对外正式发布必须用 gateway.conf（HTTPS/WSS 终结）。
# 上游用 Docker 内置 DNS 动态解析（resolver + 变量）：容器重建换 IP 后无需重启 nginx（静态 upstream 会缓存旧 IP 导致 502 / 串路由）。
# 限流阈值比生产宽松（内测机器少、脚本联调频繁）。

limit_req_zone $binary_remote_addr zone=api_zone:16m rate=50r/s;
limit_req_zone $binary_remote_addr zone=login_zone:8m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_zone:16m;

server {
  listen 80;
  server_name _;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api    http://api:8080;
  set $game   http://game:8090;
  set $client http://client-web:80;
  set $admin  http://admin-web:80;

  add_header X-Content-Type-Options nosniff always;
  client_max_body_size 1m;
  limit_conn conn_zone 100;

  location ~ ^/api/v1/auth/(guest|sms|password) {
    limit_req zone=login_zone burst=30 nodelay;
    proxy_pass $api;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
  }

  location /api/ {
    limit_req zone=api_zone burst=100 nodelay;
    proxy_pass $api;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
  }

  location /ws {
    proxy_pass $game;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # 运营后台（内测：同一入口；正式环境建议 IP 白名单 / VPN）。admin-web 以 VITE_BASE=/admin/ 构建
  location /admin/ {
    rewrite ^/admin/(.*)$ /$1 break;
    proxy_pass $admin;
    proxy_set_header Host $host;
  }
  location = /admin { return 301 /admin/; }

  # 游戏客户端（H5 / PC Web）
  location / {
    proxy_pass $client;
    proxy_set_header Host $host;
  }
}
