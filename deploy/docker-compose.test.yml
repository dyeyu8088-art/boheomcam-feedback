# 内测服务器全栈编排（HTTP，无域名 / 无证书）：一台 2 vCPU / 2 GB 的 Linux 主机即可，供 APK / H5 联调。
# 用法：bash deploy/install-test-server.sh
#   （手动：docker compose -f deploy/docker-compose.test.yml --env-file .env up -d --build）
# 与 docker-compose.prod.yml 的区别：nginx 只监听 80（gateway-http.conf）、api 单副本、不含备份 / 监控 / WAL 归档。
# 对外正式发布必须用 prod 编排（HTTPS/WSS + 备份 + 监控），见 docs/10-deployment.md §2。
name: yanbian-test
services:
  nginx:
    image: ${IMAGE_PREFIX:-}nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/gateway-http.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api, game, client-web, admin-web]
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args: { SERVICE: api, NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmjs.org}", IMAGE_PREFIX: "${IMAGE_PREFIX:-}" }
    environment:
      NODE_ENV: production
      SERVER_ID: api-1
      DATABASE_URL: postgres://${PG_USER}:${PG_PASSWORD}@postgres:5432/yanbian
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD}
      SERVICE_ROLES: auth,user,wallet,activity,social,config,admin
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped

  game:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args: { SERVICE: game, NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmjs.org}", IMAGE_PREFIX: "${IMAGE_PREFIX:-}" }
    environment:
      NODE_ENV: production
      SERVER_ID: game-1
      NODE_INDEX: "2"
      DATABASE_URL: postgres://${PG_USER}:${PG_PASSWORD}@postgres:5432/yanbian
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped

  client-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args: { APP: client-game, NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmjs.org}", IMAGE_PREFIX: "${IMAGE_PREFIX:-}" }
    restart: unless-stopped

  admin-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args: { APP: admin-web, BASE: /admin/, NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmjs.org}", IMAGE_PREFIX: "${IMAGE_PREFIX:-}" }
    restart: unless-stopped

  postgres:
    image: ${IMAGE_PREFIX:-}postgres:16-alpine
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: yanbian
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d yanbian"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: ${IMAGE_PREFIX:-}redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
