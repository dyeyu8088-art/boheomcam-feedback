<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- 原创：水果机「7」符号（红色釉面 + 金色包边）。本项目自绘，无第三方素材。 -->
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b5c"/><stop offset="0.45" stop-color="#e4212b"/><stop offset="1" stop-color="#8f0f1c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2b0"/><stop offset="0.5" stop-color="#e2b04a"/><stop offset="1" stop-color="#8a5a12"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g transform="translate(128 132)" filter="url(#shadow)">
    <!-- 7 的轮廓：上横 + 斜竖，略带倾斜 -->
    <path id="seven" d="M-62 -78 H70 L78 -50 L-2 82 H-52 L20 -42 H-70 Z"/>
    <use href="#seven" fill="url(#gold)" stroke="#5a3608" stroke-width="12" stroke-linejoin="round"/>
    <use href="#seven" fill="url(#gold)" stroke="url(#gold)" stroke-width="7" stroke-linejoin="round"/>
    <use href="#seven" fill="url(#red)" transform="scale(0.86)"/>
    <path d="M-52 -66 H58 L52 -48 H-58 Z" fill="url(#gloss)" transform="scale(0.86)"/>
  </g>
</svg>
