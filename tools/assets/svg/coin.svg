<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- 原创：平台金币（无货币符号；徽记 = 长白山三峰 + 海兰江水纹 + 朝阳）。本项目自绘，无第三方素材。 -->
  <defs>
    <radialGradient id="face" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#fff2b8"/><stop offset="0.45" stop-color="#f3c455"/><stop offset="1" stop-color="#b8791c"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff5c8"/><stop offset="0.5" stop-color="#d9a13a"/><stop offset="1" stop-color="#7d4f0f"/>
    </linearGradient>
    <linearGradient id="emboss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a6516"/><stop offset="1" stop-color="#6b420b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g transform="translate(128 128)" filter="url(#shadow)">
    <circle r="86" fill="url(#rim)"/>
    <circle r="78" fill="#8a5a12"/>
    <circle r="72" fill="url(#face)"/>
    <circle r="64" fill="none" stroke="#a8721c" stroke-width="2" stroke-dasharray="4 5" opacity="0.7"/>
    <!-- 朝阳 -->
    <circle cx="22" cy="-26" r="11" fill="url(#emboss)"/>
    <circle cx="22" cy="-26" r="7" fill="#f7d46e" opacity="0.9"/>
    <!-- 长白山三峰 -->
    <path d="M-52 18 L-30 -22 L-16 -4 L0 -34 L16 -6 L28 -18 L52 18 Z" fill="url(#emboss)"/>
    <path d="M-30 -22 L-24 -12 L-30 -8 L-36 -12 Z M0 -34 L8 -20 L0 -16 L-8 -20 Z M28 -18 L34 -10 L28 -6 L22 -10 Z" fill="#fff0c2" opacity="0.85"/>
    <!-- 海兰江水纹 -->
    <path d="M-50 30 q10 -8 20 0 t20 0 t20 0 t20 0 t20 0" fill="none" stroke="url(#emboss)" stroke-width="5" stroke-linecap="round"/>
    <path d="M-42 44 q10 -8 20 0 t20 0 t20 0 t20 0" fill="none" stroke="url(#emboss)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- 高光 -->
    <path d="M-60 -40 a72 72 0 0 1 60 -32" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity="0.45"/>
  </g>
</svg>
